# Synchronisation avec l'amont (pingdotgg/t3code)
#
# STRATÉGIE — deux branches, jamais une seule :
#
#   main      ne porte QUE le README, ce workflow et les réglages CI.
#             Elle fusionne donc toujours proprement → 100 % automatique.
#
#   travail   porte nos features. Elle touche les mêmes fichiers qu'eux
#             (composer, réglages, contrats, routes générées) → un humain
#             tranche les conflits, une fois, dans une PR dédiée.
#
# Mesuré sur 283 forks le 27/07/2026 : 41 % ont du code en plus, mais
# seuls 17 restent à jour. Ceux qui décrochent ont pourtant du travail
# réel (gedcode : 596 commits ajoutés, 650 de retard). Ce qui les tue
# n'est pas le volume, c'est l'absence de rendez-vous automatique.
#
# CIBLE — le dernier tag `nightly`, PAS la tête de leur `main` (28/07/2026).
#
# Un nightly est un état qui a passé leur CI de release ; la tête de `main`
# est le commit brut d'il y a dix minutes, parfois cassé, parfois révoqué
# une heure plus tard. On ne perd rien en fraîcheur : mesuré le 28/07, le
# dernier nightly (`v0.0.29-nightly.20260727.925`) avait deux commits de
# retard sur la tête, et il en sort un par heure environ.
#
# Le tag est retenu par DATE DE CRÉATION, jamais par tri de chaîne : les
# noms mêlent version, date et numéro de build, et un tri lexical fait
# passer `.9` après `.925`. Et il doit être un ancêtre de leur `main` —
# sinon c'est une branche latérale et on ne fusionne rien.

name: Sync upstream

on:
  schedule:
    - cron: "0 5 * * *" # tous les jours ; sans mouvement amont, le job s'arrête tôt
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/pingdotgg/t3code.git
  BRANCHE_TRAVAIL: travail
  JOURNAL: docs/JOURNAL-CONFLITS.md

jobs:
  sync:
    name: Amont → main, puis PR vers la branche de travail
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Récupérer l'amont
        run: |
          git remote add upstream "$UPSTREAM"
          # `main` sert au contrôle d'ancêtre ; les nightly sont des TAGS et
          # un `fetch <branche>` n'en rapatrie aucun, d'où `--tags`.
          git fetch upstream main --tags

      - name: Choisir le nightly le plus récent
        id: cible
        run: |
          TAG=$(git for-each-ref --sort=-creatordate --count=1 \
            --format='%(refname:short)' 'refs/tags/v*-nightly.*')
          if [ -z "$TAG" ]; then
            echo "::error::Aucun tag nightly chez l'amont — ont-ils changé de nommage ?"
            echo "### ❌ Aucun tag nightly trouvé" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # Un nightly doit être un état de LEUR ligne principale. S'il vient
          # d'ailleurs, on ne fusionne rien : rater une nuit coûte moins cher
          # qu'injecter une branche latérale dans le fork.
          if ! git merge-base --is-ancestor "$TAG" upstream/main; then
            echo "::error::$TAG n'est pas un ancêtre de upstream/main — cible refusée."
            echo "### ❌ \`$TAG\` n'est pas sur leur main" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Cible : \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      # AMÉLIORATION 1 — ne rien faire s'ils n'ont pas bougé.
      # Sinon on ouvre des PR vides tous les jours et le signal s'use.
      - name: L'amont a-t-il bougé ?
        id: bouge
        run: |
          RETARD=$(git rev-list --count "HEAD..${{ steps.cible.outputs.tag }}")
          echo "retard=$RETARD" >> "$GITHUB_OUTPUT"
          echo "L'amont a $RETARD commit(s) d'avance." >> "$GITHUB_STEP_SUMMARY"
          # `if` et non `[ … ] && …` : le shell tourne en `bash -e`, et un test
          # faux en DERNIÈRE commande fait échouer l'étape. Le piège est vicieux :
          # vert quand il n'y a rien à faire, rouge dès qu'il y a du travail.
          # Prouvé en conditions réelles le 27/07/2026 (run 30276983321).
          if [ "$RETARD" -eq 0 ]; then
            echo "Rien à faire." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fusionner l'amont dans main
        if: steps.bouge.outputs.retard != '0'
        # Le tag, jamais `upstream/main` : le message de fusion nomme alors la
        # version exacte qu'on embarque, et l'historique du fork se lit comme
        # une suite de builds identifiés plutôt que de « merge du jour ».
        run: |
          # ⚠️ CE QU'IL NE FAUT PAS FAIRE SUR `main`, ET LA RAISON.
          #
          # `main` est la branche qui fusionne AUTOMATIQUEMENT. Tout fichier
          # qu'on y modifie et que l'amont modifie aussi devient un conflit
          # quotidien — et un conflit sur `main` arrête la synchro, donc le
          # fork cesse de suivre l'amont. La tentation est réelle : corriger
          # le README pour qu'il pointe NOS releases, ou le `repository` du
          # package.json. Les deux sont des fichiers que l'amont touche.
          #
          # Nos divergences vivent sur `travail`, qui passe par une PR relue.
          # `main` ne porte que ce que l'amont ne touche pas : nos propres
          # workflows (`raptor-*.yml`, celui-ci).
          #
          # LA FUSION PEUT ENTRER EN CONFLIT SUR UN FICHIER QU'ON JETTE JUSTE
          # APRÈS — et c'est exactement ce qui a tué la synchro.
          #
          # Le run du 2026-08-01 est mort ici, sur UN seul fichier :
          # `.github/workflows/mobile-showcase-screenshots.yml`. Or le bloc
          # ci-dessous écarte SYSTÉMATIQUEMENT tout changement de workflow
          # amont. La fusion échouait donc sur un fichier qu'on allait
          # abandonner trois lignes plus bas, et le fork a cessé de vieillir
          # avec l'amont pendant deux jours.
          #
          # On résout donc ces conflits-là en gardant les NÔTRES. Tout conflit
          # AILLEURS reste une panne bruyante : c'est le signal qu'un humain
          # doit trancher, et il ne doit jamais être avalé.
          if ! git merge "${{ steps.cible.outputs.tag }}" --no-edit --no-ff; then
            CONFLITS=$(git diff --name-only --diff-filter=U)
            HORS_WORKFLOWS=$(printf '%s\n' "$CONFLITS" | grep -v '^\.github/workflows/' || true)
            if [ -n "$HORS_WORKFLOWS" ]; then
              echo "::error::Conflits hors .github/workflows — un humain doit trancher :"
              printf '%s\n' "$HORS_WORKFLOWS"
              git merge --abort
              exit 1
            fi
            echo "::warning::Conflits limités aux workflows amont, résolus en gardant les nôtres : $(printf '%s' "$CONFLITS" | tr '\n' ' ')"
            printf '%s\n' "$CONFLITS" | while IFS= read -r fichier; do
              [ -n "$fichier" ] || continue
              git checkout --ours -- "$fichier" 2>/dev/null || git rm -q -f -- "$fichier"
              git add -- "$fichier" 2>/dev/null || true
            done
            git commit -q --no-edit
          fi

          # GITHUB_TOKEN NE PEUT PAS pousser un commit qui touche
          # `.github/workflows/**`. Ce n'est pas un réglage qu'on a raté :
          # aucune clé du bloc `permissions:` ne l'autorise, c'est une limite
          # dure de GitHub (il faudrait un PAT portant le scope `workflow`).
          # L'amont modifie ses workflows régulièrement, donc SANS ce garde
          # la synchro casse un jour sur deux, après avoir tout fusionné et
          # tout vérifié — le pire endroit pour échouer.
          # Constaté en conditions réelles le 28/07/2026 (run 30313999385,
          # leur `release.yml` touché) : « refusing to allow a GitHub App to
          # create or update workflow ... without `workflows` permission ».
          #
          # On garde donc LES NÔTRES. Les neuf workflows hérités de l'amont
          # sont désactivés dans ce fork depuis le premier jour : leurs mises
          # à jour ne nous servent à rien, et les ignorer coûte moins cher
          # qu'un secret à faire tourner. Jamais en silence pour autant — la
          # liste part dans le résumé du run.
          if ! git diff --quiet HEAD^ HEAD -- .github/workflows; then
            LISTE=$(git diff --name-only HEAD^ HEAD -- .github/workflows | tr '\n' ' ')
            git checkout HEAD^ -- .github/workflows
            git commit -q --amend --no-edit
            echo "::warning::Workflows amont ignorés (non poussables par GITHUB_TOKEN) : $LISTE"
            {
              echo "### ⚠️ Workflows de l'amont ignorés"
              echo ""
              echo "Non poussables par \`GITHUB_TOKEN\` ; les nôtres sont conservés :"
              for f in $LISTE; do echo "- \`$f\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: voidzero-dev/setup-vp@v1
        if: steps.bouge.outputs.retard != '0'
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Vérifications sur main
        if: steps.bouge.outputs.retard != '0'
        run: |
          vp check
          vp run typecheck

      - name: Pousser main
        if: steps.bouge.outputs.retard != '0'
        run: git push origin main

      # AMÉLIORATION 2 — on tente la fusion À BLANC pour SAVOIR, tout de
      # suite, si ça casse et OÙ. Leur version ouvre une PR sans regarder :
      # on découvre les conflits en la lisant, parfois des jours plus tard.
      - name: Fusion à blanc dans la branche de travail
        if: steps.bouge.outputs.retard != '0'
        id: blanc
        run: |
          git checkout -B essai "origin/${BRANCHE_TRAVAIL}"
          if git merge main --no-commit --no-ff 2>/dev/null; then
            echo "conflits=" >> "$GITHUB_OUTPUT"
            echo "propre=oui" >> "$GITHUB_OUTPUT"
            echo "✅ Fusion propre — aucun conflit." >> "$GITHUB_STEP_SUMMARY"
          else
            LISTE=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflits=$LISTE" >> "$GITHUB_OUTPUT"
            echo "propre=non" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ Conflits à trancher à la main"
              echo ""
              for f in $LISTE; do echo "- \`$f\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          git merge --abort 2>/dev/null || true
          git checkout main

      # AMÉLIORATION 3 — le JOURNAL DES CONFLITS.
      # Chaque fichier qui a mordu est consigné avec sa date. Au bout de
      # quelques semaines on sait lesquels de NOS changements coûtent cher,
      # et on peut décider de les redessiner ou de les abandonner.
      # C'est la seule façon de piloter le coût d'un fork au lieu de le subir.
      - name: Consigner les conflits
        if: steps.bouge.outputs.retard != '0' && steps.blanc.outputs.propre == 'non'
        run: |
          mkdir -p "$(dirname "$JOURNAL")"
          [ -f "$JOURNAL" ] || printf '# Journal des conflits de synchronisation\n\n| Date | Version amont | Fichier |\n|---|---|---|\n' > "$JOURNAL"
          for f in ${{ steps.blanc.outputs.conflits }}; do
            printf '| %s | `%s` | `%s` |\n' "$(date -u +%Y-%m-%d)" "${{ steps.cible.outputs.tag }}" "$f" >> "$JOURNAL"
          done
          git add "$JOURNAL"
          git commit -m "chore(sync): conflits du $(date -u +%Y-%m-%d)" || exit 0
          git push origin main

      - name: Ouvrir ou mettre à jour la PR
        if: steps.bouge.outputs.retard != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CIBLE="Cible : \`${{ steps.cible.outputs.tag }}\` (${{ steps.bouge.outputs.retard }} commit(s))."
          if [ "${{ steps.blanc.outputs.propre }}" = "oui" ]; then
            CORPS=$(printf '%s\n\nFusion **sans conflit**. Relire les tests, puis fusionner.\n' "$CIBLE")
          else
            CORPS=$(printf '%s\n\nConflits à trancher :\n' "$CIBLE"; for f in ${{ steps.blanc.outputs.conflits }}; do printf -- '- `%s`\n' "$f"; done)
          fi
          # `--repo` est OBLIGATOIRE ici. Sur un fork, `gh pr` vise le dépôt
          # PARENT par défaut : sans ce drapeau le robot tente d'ouvrir une PR
          # chez l'amont et se fait refuser
          # (« Resource not accessible by integration »).
          # Prouvé en conditions réelles le 27/07/2026 (run 30277068981).
          EXISTE=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --base "$BRANCHE_TRAVAIL" --head main --state open --json number --jq '.[0].number')
          if [ -n "$EXISTE" ]; then
            gh pr edit "$EXISTE" --repo "$GITHUB_REPOSITORY" --body "$CORPS"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" \
              --base "$BRANCHE_TRAVAIL" --head main \
              --title "Sync amont → $BRANCHE_TRAVAIL" --body "$CORPS"
          fi

      # AMÉLIORATION 4 — bruit obligatoire quand un humain doit intervenir.
      # Une PR silencieuse qui dort trois semaines, c'est un fork mort.
      - name: Alerter si intervention humaine requise
        if: steps.bouge.outputs.retard != '0' && steps.blanc.outputs.propre == 'non'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CORPS=$(printf 'Cible : `%s`\n\nFichiers en conflit :\n' "${{ steps.cible.outputs.tag }}"
            for f in ${{ steps.blanc.outputs.conflits }}; do printf -- '- `%s`\n' "$f"; done
            printf '\nVoir %s pour l historique.\n' "$JOURNAL")
          # Surtout PAS de `|| true` ici. Les issues sont DÉSACTIVÉES par défaut
          # sur un fork GitHub : l'alerte échoue en silence et l'étape passe au
          # vert sans avoir prévenu personne — le faux vert exact que cette
          # alerte est censée empêcher. Constaté le 27/07/2026 (run 30277399359).
          # Activer : gh api repos/OWNER/REPO -X PATCH -F has_issues=true
          if ! gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Sync amont bloquée — conflits du $(date -u +%Y-%m-%d)" \
              --body "$CORPS"; then
            echo "::error::Alerte impossible — les issues sont-elles activées sur ce dépôt ?"
            echo "### ❌ L'alerte n'a pas pu être créée" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # AMÉLIORATION 5 — le filet qui manquait, et qui a coûté deux jours.
      #
      # L'alerte ci-dessus ne se déclenche QUE sur un conflit de la fusion à
      # blanc dans `travail`. Si une étape ANTÉRIEURE meurt, le job s'arrête
      # avant d'y arriver et personne n'apprend rien.
      #
      # C'est exactement ce qui s'est produit : le run du 2026-08-01 a échoué à
      # l'étape 7 (« Fusionner l'amont dans main ») — le pari « main fusionne
      # toujours proprement » ne tenait plus. Aucune issue, aucun signal. La
      # synchro était morte depuis deux jours quand on l'a découverte, et
      # seulement parce qu'on cherchait autre chose.
      #
      # `if: failure()` attrape n'importe quelle étape précédente. Une panne de
      # synchro doit se VOIR : un fork qui ne se synchronise plus ne le dit
      # jamais de lui-même, il vieillit simplement.
      - name: Alerter si la synchro a échoué, quelle qu'en soit l'étape
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JOUR=$(date -u +%Y-%m-%d)
          TITRE="Sync amont EN PANNE — $JOUR"
          CORPS=$(printf 'La synchronisation avec l amont a échoué.\n\nRun : %s/%s/actions/runs/%s\n\nTant que ce n est pas réparé, le fork VIEILLIT en silence : aucun commit de l amont n arrive, et rien ne le signale ailleurs.\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")

          # Une issue par jour au maximum : une panne qui dure ne doit pas
          # produire une issue par run, sinon on apprend à les ignorer.
          if gh issue list --repo "$GITHUB_REPOSITORY" --state open \
               --search "$TITRE in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "→ une alerte du jour existe déjà, on n en rouvre pas une seconde"
            exit 0
          fi

          if ! gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "$CORPS"; then
            echo "::error::Alerte de panne impossible — issues désactivées ?"
            echo "### ❌ La synchro a échoué ET l alerte n a pas pu être créée" >> "$GITHUB_STEP_SUMMARY"
          fi
